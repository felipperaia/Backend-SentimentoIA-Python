[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
INSTALL_PLAYWRIGHT_BROWSERS = "false"

[phases.setup]
nixPkgs = ["python312Full"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && python -m pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && python -m pip install -r requirements.txt",
  ". /opt/venv/bin/activate && python -m pip install -r requirements-scraper.txt",
  "if [ \"$INSTALL_PLAYWRIGHT_BROWSERS\" = \"true\" ]; then . /opt/venv/bin/activate && python -m playwright install --with-deps chromium; fi"
]

[phases.build]
cmds = [
  "python -m compileall app"
]

[start]
cmd = "python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
